<div class="container container-cards-pf">
		<div class="row">
			<div	ng-repeat="item in products" class="col-md-4 item" pf-card show-top-border="true"
					head-title="{{item.product.name}}"
					sub-title="{{item.product.desc}}">
				<div class="row">
				  <div class="col-xs-12">
					<div style="font-size:64px;text-align:center;padding:20px" ng-switch="item.product.itemId">
					<span ng-switch-when="100">&#x1F3E5;</span>
					<span ng-switch-when="101">&#x1FA7A;</span>
					<span ng-switch-when="102">&#x1F9B7;</span>
					<span ng-switch-when="103">&#x1F453;</span>
					<span ng-switch-when="104">&#x1F6E1;</span>
					<span ng-switch-default>&#x2695;</span>
				</div>
				  </div>
				</div>							

				<div class="row coolstore-row">
				  <div class="col-xs-12">

					  <div>
						<span><h1>{{item.product.price | currency}}</h1></span>
						  <div ng-if="item.product.quantity > 0" style="float:right"><label title="{{item.product.quantity}} in our store in {{item.product.location}}" class="label label-{{item.product.quantity < 15 ? 'warning' : 'primary'}}">{{item.product.quantity}} left!</label><a target="_blank" href="{{item.product.link}}">&nbsp;<span class="fa fa-map-marker fa-lg"></span></a></div>

						  <div ng-if="item.product.quantity <= 0" style="float:right"><span class="fa fa-warning fa-lg"></span>&nbsp;Inventory unavailable</div>
					  </div>

					  <form class="form-inline">
					  <div class="form-group">
					    <select name="quan" ng-model="item.quantity" class="form-control" id="quan">
					    	<option value="1" selected>1</option>
					    	<option value="2">2</option>
					    	<option value="3">3</option>
					    	<option value="4">4</option>
					    	<option value="5">5</option>
				    	</select>
				    	
					  </div>
					  <button ng-click="addToCart(item)" type="submit" class="btn btn-default">Elect Plan</button>
					</form>
				  </div>
				</div>
			</div>				
		</div>
				
</div>

<script type="text/javascript">
		$('div.container > div.row').imagesLoaded(function() {
			setTimeout(function() {
			console.log("loading masonry");
			$('div.container > div.row').isotope({
				itemSelector: '.item',
				columnWidth: '.item',
				layoutMode: 'masonry'
			});
			}, 1000);
		});

</script>
